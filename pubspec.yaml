name: medicare_app
description: "Medicare Patient Monitoring System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_database: ^12.4.7

  fl_chart: ^1.2.0
  intl: ^0.20.3
  http: ^1.6.0

  image_picker: ^1.2.3
  shared_preferences: ^2.5.5

  geolocator: ^14.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/medicare_hook.png
    - assets/images/medicare_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/medicare_icon.png"
  min_sdk_android: 21